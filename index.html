 {c:'C1.2',t:'En convention récepteur, place la flèche de tension aux bornes de chaque résistance.'},
 {c:'C1.1',t:'Une équipotentielle est l’ensemble des conducteurs au même potentiel. Colorie chaque équipotentielle avec la couleur de sa lettre.'},
 {c:'C1.1',t:'Exprime chaque tension en fonction de la tension du dipôle branché entre ces deux points : les tensions par rapport à la masse M, puis les tensions aux bornes des résistances.'}
];
const MCQ=[{k:'same',t:'Les deux flèches sont dans le même sens.'},{k:'opp',t:'Les deux flèches sont en sens opposés.'},{k:'none',t:'On ne flèche pas le courant dans un récepteur.'}];
const OPP={up:'down',down:'up',left:'right',right:'left'};
const SUBD={'1':'₁','2':'₂','3':'₃','4':'₄'};
const pretty=s=>s.replace(/V(\d)/g,(m,d)=>'V'+SUBD[d]).replace(/-/g,'−');
const fmt=s=>s.replace(/V_([A-Z]{1,2}\d?)\b/g,'V<sub>$1</sub>').replace(/\b([VIRE])(\d)\b/g,'$1<sub>$2</sub>');
function neg(s){
  let m;
  if((m=s.match(/^(V\d)-(V\d)$/))) return m[2]+'-'+m[1];
  if(s.startsWith('-(')) return s.slice(2,-1);
  if(s.startsWith('-')) return s.slice(1);
  if(s.includes('+')) return '-('+s+')';
  return '-'+s;
}

/* ================= STATE ================= */
let C, S, CI=0;
const RESULTS=[null,null,null,null];
const ERRS=new Set(); let REM=null, REMDONE=false;
function fresh(ci,eUp){
  CI=ci; C=CIRCUITS[ci];
  const arr={I:null}, lab={};
  C.cur.forEach(c=>{arr[c.id]=null;lab[c.id]=null}); C.vol.forEach(v=>arr[v.id]=null);
  const types={E:null}; C.res.forEach(r=>types[r.n]=null);
  const q7={}; C.q7.forEach(q=>q7[q.k]='');
  S={eUp:eUp!==false,pos:0,types,arr,lab,seg:{},brush:'A',mcq:null,q7,sel:null,tries:0,fb:null,solved:false,first:{}};
  if(CONVIP[ci]&&!RESULTS[ci])Object.assign(S,clone(CONVIP[ci]));
}
function saveConvIP(){if(RESULTS[CI]&&S.pos>=C.steps.length)delete CONVIP[CI];else CONVIP[CI]=clone(S);saveProg();}
const step=()=>C.steps[S.pos];
const d=dir=>S.eUp?dir:OPP[dir];
const acc=q=>S.eUp?q.acc:q.acc.map(neg);
function options(){const o=[];C.opts.forEach(x=>{[x,neg(x)].forEach(y=>{if(!o.includes(y))o.push(y)})});return o}
function applySolution(k){
  if(k===0){S.types.E='gen';C.res.forEach(r=>S.types[r.n]='rec');}
  if(k===1) S.arr.I=d('up');
  if(k===2){const names={};let n=1;C.cur.forEach(c=>{S.arr[c.id]=d(c.exp);if(c.br==='gen')S.lab[c.id]='I';else{if(!names[c.br])names[c.br]='I'+(n++);S.lab[c.id]=names[c.br];}});}
  if(k===3) S.mcq='opp';
  if(k===4) C.vol.forEach(v=>S.arr[v.id]=OPP[d(C.cur.find(c=>c.r===v.r).exp)]);
  if(k===5) C.segs.forEach(g=>S.seg[g.id]=g.g);
  if(k===6) C.q7.forEach(q=>S.q7[q.k]=acc(q)[0]);
}

/* ================= CHECK ================= */
function check(){
  const k=step();
  if(k===0){
    if(Object.values(S.types).some(v=>!v)) return {incomplete:'Indique la nature de tous les dipôles.'};
    if(S.types.E!=='gen') return {bad:'E fournit l’énergie au circuit : c’est le générateur.'};
    if(C.res.some(r=>S.types[r.n]!=='rec')) return {bad:'Une résistance ne peut que recevoir de l’énergie : c’est un récepteur.'};
    return {ok:'E est le générateur ; les résistances sont des récepteurs.'};
  }
  if(k===1){
    if(!S.arr.I) return {incomplete:'Touche la zone en pointillés sur la branche de E pour placer la flèche.'};
    if(S.arr.I!==d('up')) return {bad:'En convention générateur, la flèche de courant et la flèche de tension sont dans le même sens. Regarde la flèche de E.',type:'conv'};
    return {ok:'Le courant I est fléché dans le même sens que E.'};
  }
  if(k===2){
    if(C.cur.some(c=>!S.arr[c.id]||!S.lab[c.id])) return {incomplete:'Place une flèche et une étiquette sur chaque zone en pointillés.'};
    for(const c of C.cur){ if(c.br==='gen'&&S.lab[c.id]!=='I') return {bad:c.r+' est en série avec le générateur : il est traversé par le même courant I.',type:'serie'}; }
    for(const c of C.cur){ if(c.br!=='gen'&&S.lab[c.id]==='I') return {bad:'I est le courant du générateur. '+c.r+' est sur une autre branche : son courant porte un autre nom.',type:'serie'}; }
    for(let i=0;i<C.cur.length;i++)for(let j=i+1;j<C.cur.length;j++){
      const a=C.cur[i],b=C.cur[j];
      if(a.br===b.br&&S.lab[a.id]!==S.lab[b.id]) return {bad:a.r+' et '+b.r+' sont en série : elles sont traversées par le même courant, avec la même étiquette.',type:'serie'};
      if(a.br!==b.br&&S.lab[a.id]===S.lab[b.id]) return {bad:a.r+' et '+b.r+' ne sont pas sur la même branche : leurs courants n’ont pas la même étiquette.',type:'serie'};
    }
    const wrong=C.cur.filter(c=>S.arr[c.id]!==d(c.exp)).map(c=>c.r);
    if(wrong.length) return {bad:'Vérifie le sens dans '+wrong.join(', ')+'. Suis le courant I : il sort du générateur par la borne indiquée par la flèche de E, puis se partage aux nœuds.'};
    return {ok:'Les courants sont bien fléchés dans le sens réel, avec une étiquette par branche.'};
  }
  if(k===3){
    if(!S.mcq) return {incomplete:'Choisis une réponse.'};
    if(S.mcq!=='opp') return {bad:'Compare avec la convention générateur de la question précédente : pour un récepteur, c’est l’inverse.',type:'conv'};
    return {ok:'En convention récepteur, flèche de tension et flèche de courant sont opposées.'};
  }
  if(k===4){
    if(C.vol.some(v=>!S.arr[v.id])) return {incomplete:'Place une flèche de tension sur chaque résistance.'};
    const wrong=C.vol.filter(v=>S.arr[v.id]!==OPP[S.arr[C.cur.find(c=>c.r===v.r).id]]).map(v=>v.r);
    if(wrong.length) return {bad:'Pour '+wrong.join(', ')+' : en convention récepteur, la flèche de tension est opposée à la flèche de courant.',type:'conv'};
    return {ok:'Chaque flèche de tension est opposée au courant qui traverse la résistance.'};
  }
  if(k===5){
    const left=C.segs.filter(g=>!S.seg[g.id]).length;
    if(left) return {incomplete:'Colorie tous les fils du schéma (il en reste '+left+').'};
    const col=g=>[...new Set(C.segs.filter(s=>s.g===g).map(s=>S.seg[s.id]))];
    const cols=C.groups.map(col);
    if(cols.some(c=>c.length>1)) return {bad:'Deux fils reliés sans composant entre eux sont au même potentiel : ils doivent avoir la même couleur.'};
    if(col('M')[0]!=='M') return {bad:'L’équipotentielle reliée à la masse est notée M.'};
    if(new Set(cols.map(c=>c[0])).size<cols.length) return {bad:'Un composant sépare toujours deux équipotentielles différentes : vérifie de chaque côté des résistances.'};
    if(C.groups.some(g=>col(g)[0]!==g)) return {bad:'Les équipotentielles sont bien séparées, mais regarde les lettres sur la figure : chaque fil prend la couleur du point qu’il relie.'};
    return {ok:C.groups.length+' équipotentielles : '+C.groups.join(', ')+'.'};
  }
  if(k===6){
    if(C.q7.some(q=>!S.q7[q.k])) return {incomplete:'Choisis une expression pour chaque tension.'};
    for(const q of C.q7) if(!acc(q).includes(S.q7[q.k])) return {bad:q.hint};
    const multi=C.q7.filter(q=>q.acc.length>1).map(q=>'V_'+q.k+' = '+acc(q).map(pretty).join(' = '));
    return {ok:'Juste.'+(multi.length?' Écritures acceptées : '+multi.join(' ; ')+'.':'')};
  }
}

/* ================= SVG ================= */
function el(n,a,p){const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a){const t=el('text',Object.assign({x,y,'font-family':'IBM Plex Sans, system-ui, sans-serif','font-size':16,'font-weight':700,fill:'var(--ink)'},a||{}),p);
  const m=s.match(/^([A-Z])(\d)$/);
  if(m){t.textContent=m[1];el('tspan',{'font-size':11,dy:4},t).textContent=m[2];}else t.textContent=s;return t}
function arrow(p,cx,cy,len,dir,color,w){
  const u={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir],h=len/2;
  const tx=cx+u[0]*h,ty=cy+u[1]*h,sx=cx-u[0]*h,sy=cy-u[1]*h,px=-u[1],py=u[0];
  el('line',{x1:sx,y1:sy,x2:tx-u[0]*7,y2:ty-u[1]*7,stroke:color,'stroke-width':w||2.6,'stroke-linecap':'round'},p);
  el('path',{d:`M${tx} ${ty} L${tx-u[0]*10+px*5.5} ${ty-u[1]*10+py*5.5} L${tx-u[0]*10-px*5.5} ${ty-u[1]*10-py*5.5} Z`,fill:color},p);
}
function slotBox(p,g,sel,wide){
  const a=g.len+8,b=wide?30:22,w=g.o==='h'?a:b,h=g.o==='h'?b:a;
  el('rect',{x:g.x-w/2,y:g.y-h/2,width:w,height:h,rx:6,fill:'none',stroke:sel?'var(--accent)':'var(--slot)','stroke-width':sel?2.4:1.4,'stroke-dasharray':sel?'0':'4 3'},p);
}
function hit(p,g,fn){
  const a=g.len+14,b=36,w=g.o==='h'?a:b,h=g.o==='h'?b:a;
  el('rect',{x:g.x-w/2,y:g.y-h/2,width:w,height:h,fill:'transparent',style:'cursor:pointer'},p).addEventListener('click',fn);
}
function draw(){
  const k=step(),svg=el('svg',{viewBox:'0 0 350 285',role:'img','aria-label':C.name});
  const eqOn=k>=5,eqCol={A:'var(--eqA)',B:'var(--eqB)',C:'var(--eqC)',M:'var(--eqM)'};
  C.segs.forEach(g=>{const c=eqOn&&S.seg[g.id];el('line',{x1:g.x1,y1:g.y1,x2:g.x2,y2:g.y2,stroke:c?eqCol[c]:'var(--ink)','stroke-width':c?5:2.4,'stroke-linecap':'round'},svg)});
  // generator
  el('circle',{cx:60,cy:145,r:22,fill:'var(--surface2)',stroke:'var(--ink)','stroke-width':2.4},svg);
  el('line',{x1:60,y1:123,x2:60,y2:167,stroke:'var(--ink)','stroke-width':2.4},svg);
  arrow(svg,26,146,36,S.eUp?'up':'down','var(--ink)',2.4); txt(svg,6,151,'E');
  C.res.forEach(r=>{const w=r.o==='h'?r.len:20,h=r.o==='h'?20:r.len;
    el('rect',{x:r.x-w/2,y:r.y-h/2,width:w,height:h,fill:'var(--surface2)',stroke:'var(--ink)','stroke-width':2.4},svg);txt(svg,r.lx,r.ly,r.n);});
  C.nodes.forEach(n=>el('circle',{cx:n[0],cy:n[1],r:4.2,fill:'var(--ink)'},svg));
  el('line',{x1:60,y1:250,x2:60,y2:262,stroke:'var(--ink)','stroke-width':2.4},svg);
  el('line',{x1:46,y1:262,x2:74,y2:262,stroke:'var(--ink)','stroke-width':2.4},svg);
  [0,1,2].forEach(i=>el('line',{x1:50+i*9,y1:264,x2:44+i*9,y2:274,stroke:'var(--ink)','stroke-width':1.8},svg));
  txt(svg,24,272,'M');
  if(eqOn) C.letters.forEach(l=>{if(l.dot)el('circle',{cx:l.dot[0],cy:l.dot[1],r:4.2,fill:'var(--ink)'},svg);txt(svg,l.x,l.y,l.t,{fill:eqCol[l.t]});});
  const lock=S.solved;
  // generator current
  const G=Object.assign({o:'v'},GEN);
  if(k===1&&!lock) slotBox(svg,G,S.sel==='I',true);
  if(S.arr.I){arrow(svg,G.x,G.y,G.len,S.arr.I,'var(--cur)',3);txt(svg,G.lx,G.ly,'I',{fill:'var(--cur)'});}
  if(k===1&&!lock) hit(svg,G,()=>{S.sel='I';S.fb=null;render()});
  // branch currents
  C.cur.forEach(c=>{
    const act=k===2&&!lock;
    if(act) slotBox(svg,c,S.sel===c.id,true);
    if(S.arr[c.id]){arrow(svg,c.x,c.y,c.len,S.arr[c.id],'var(--cur)',3);if(S.lab[c.id])txt(svg,c.lx,c.ly,S.lab[c.id],{fill:'var(--cur)'});}
    if(act) hit(svg,c,()=>{S.sel=c.id;S.fb=null;render()});
  });
  C.vol.forEach(v=>{
    const act=k===4&&!lock;
    if(act) slotBox(svg,v,S.sel===v.id,false);
    if(S.arr[v.id]){arrow(svg,v.x,v.y,v.len-4,S.arr[v.id],'var(--volt)',2.8);txt(svg,v.lx,v.ly,v.lab,{fill:'var(--volt)'});}
    if(act) hit(svg,v,()=>{S.sel=v.id;S.fb=null;render()});
  });
  if(k===5&&!lock) C.segs.forEach(g=>{
    el('line',{x1:g.x1,y1:g.y1,x2:g.x2,y2:g.y2,stroke:'transparent','stroke-width':20,style:'cursor:pointer'},svg)
      .addEventListener('click',()=>{S.seg[g.id]=S.brush;S.fb=null;render()});
  });
  return svg;
}

/* ================= UI ================= */
const $=(t,a,c)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==='text')e.textContent=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}(c||[]).forEach(x=>x&&e.appendChild(x));return e};
const chip=(label,pressed,on,dis)=>{const b=$('button',{class:'chip',type:'button','aria-pressed':pressed?'true':'false',onclick:on,html:label});if(dis)b.disabled=true;return b};
const findSlot=id=>id==='I'?Object.assign({o:'v'},GEN):C.cur.find(c=>c.id===id)||C.vol.find(v=>v.id===id);

function header(){
  modes();document.getElementById('h1').textContent='Conventions – Flécher courants et tensions';
  document.getElementById('exid').textContent=C.id+(S.eUp?'':' · E inversé');
  const st=document.getElementById('stars');st.textContent='★'.repeat(C.lvl)+'☆'.repeat(4-C.lvl);st.setAttribute('aria-label','Niveau '+C.lvl+' sur 4');
  document.getElementById('cname').textContent=C.name;
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  CIRCUITS.forEach((c,i)=>{const b=$('button',{class:'tab'+(RESULTS[i]?' done':''),type:'button','aria-current':i===CI?'true':'false',text:'Circuit '+(i+1),onclick:()=>{fresh(i);render();}});tabs.appendChild(b)});
  if(TEACHER) tabs.appendChild($('button',{class:'tab',type:'button','aria-current':'false',text:'Remédiation (démo)',onclick:()=>startRem(false)}));
  const pr=document.getElementById('progress');pr.innerHTML='';
  C.steps.forEach((s,i)=>pr.appendChild($('span',{class:i<S.pos?'done':i===S.pos?'now':''})));
}
function render(){
  if(ETU&&!ID){renderIdent();return}
  if(ETU&&SENDMODE){renderSend();return}
  if(GR&&GR.active){renderGR();return}
  if(MODE==='alerts'){renderAlerts();return}
  if(MODE==='c22'){renderDiv();return}
  if(PH[MODE]){renderSoon(MODE);return}
  if(ACTS[MODE]){renderOhm();return}
  if(REM&&REM.active){renderRem();return}
  header();
  const card=document.getElementById('card');card.innerHTML='';
  if(S.pos>=C.steps.length){renderBilan(card);return}
  const k=step(),st=STEPS[k],lock=S.solved;
  card.appendChild($('div',{class:'qhead'},[$('span',{class:'qnum',text:'Question '+(S.pos+1)+' / '+C.steps.length}),$('span',{class:'comp',text:st.c})]));
  card.appendChild($('p',{class:'qtext',html:fmt(st.t)}));
  card.appendChild($('div',{class:'fig'},[draw()]));
  const ctl=$('div',{class:'ctl'});
  if(k===0){
    ['E'].concat(C.res.map(r=>r.n)).forEach(n=>{
      ctl.appendChild($('div',{class:'dip'},[$('b',{html:fmt(n)}),$('div',{class:'row'},[
        chip('Générateur',S.types[n]==='gen',()=>{S.types[n]='gen';S.fb=null;render()},lock),
        chip('Récepteur',S.types[n]==='rec',()=>{S.types[n]='rec';S.fb=null;render()},lock)])]));
    });
  }
  if((k===1||k===2||k===4)&&!lock){
    if(!S.sel) ctl.appendChild($('p',{class:'help',text:'Touche une zone en pointillés sur le schéma, puis choisis le sens'+(k===2?' et l’étiquette':'')+'.'}));
    else{
      const g=findSlot(S.sel),res=g.r||'E';
      const name=S.sel==='I'?'courant dans la branche de E':S.sel[0]==='c'?'courant dans '+res:'tension aux bornes de '+res;
      ctl.appendChild($('span',{class:'lbl',html:'Sélection : '+fmt(name)}));
      const dirs=g.o==='h'?[['left','← Vers la gauche'],['right','→ Vers la droite']]:[['up','↑ Vers le haut'],['down','↓ Vers le bas']];
      ctl.appendChild($('div',{class:'row'},dirs.map(x=>chip(x[1],S.arr[S.sel]===x[0],()=>{S.arr[S.sel]=x[0];S.fb=null;render()})).concat([
        chip('Effacer',false,()=>{S.arr[S.sel]=null;if(S.sel in S.lab)S.lab[S.sel]=null;S.fb=null;render()})])));
      if(k===2){
        ctl.appendChild($('span',{class:'lbl',text:'Étiquette'}));
        ctl.appendChild($('div',{class:'row'},['I','I1','I2','I3'].map(l=>chip(fmt(l),S.lab[S.sel]===l,()=>{S.lab[S.sel]=l;S.fb=null;render()}))));
      }
    }
  }
  if(k===3){const m=$('div',{class:'mcq'});MCQ.forEach(o=>m.appendChild(chip(o.t,S.mcq===o.k,()=>{S.mcq=o.k;S.fb=null;render()},lock)));ctl.appendChild(m);}
  if(k===5&&!lock){
    ctl.appendChild($('span',{class:'lbl',text:'Choisis une couleur, puis touche les fils'}));
    ctl.appendChild($('div',{class:'row'},C.groups.map(c=>{const b=chip('Équipot. '+c,S.brush===c,()=>{S.brush=c;render()});b.classList.add('brush');b.dataset.c=c;return b})));
    ctl.appendChild(chip('Tout effacer',false,()=>{S.seg={};S.fb=null;render()}));
  }
  if(k===6){
    const g=$('div',{class:'q7'}),opts=options();
    C.q7.forEach(q=>{
      const s=$('select',{id:'q7'+q.k,'aria-label':'V'+q.k});
      s.appendChild($('option',{value:'',text:'choisir…'}));
      opts.forEach(e=>{const o=$('option',{value:e,text:pretty(e)});if(S.q7[q.k]===e)o.selected=true;s.appendChild(o)});
      s.disabled=lock;s.addEventListener('change',()=>{S.q7[q.k]=s.value;S.fb=null;render()});
      g.appendChild($('label',{for:'q7'+q.k,html:'V<sub>'+q.k+'</sub> ='}));g.appendChild(s);
    });
    ctl.appendChild(g);
  }
  card.appendChild(ctl);
  if(S.fb) card.appendChild($('p',{class:'fb '+S.fb.cls,html:fmt(S.fb.msg)}));
  const btns=$('div',{class:'btns'});
  if(!lock){
    btns.appendChild($('button',{class:'btn primary',type:'button',text:'Vérifier',onclick:doCheck}));
    if(S.tries>=2) btns.appendChild($('button',{class:'btn ghost',type:'button',text:'Voir la correction',onclick:reveal}));
  }else btns.appendChild($('button',{class:'btn primary',type:'button',text:S.pos<C.steps.length-1?'Question suivante':'Voir le bilan',onclick:next}));
  card.appendChild(btns);
}
function doCheck(){
  const r=check();
  if(r.incomplete){S.fb={cls:'hint',msg:r.incomplete};render();return}
  if(r.bad){if(r.type==='serie'){ERRS.add(CI);saveProg();}if(r.type==='conv')noteErr('conv','circ'+CI);S.tries++;S.fb={cls:'bad',msg:(S.tries>=2?'Encore raté. ':'Pas tout à fait. ')+r.bad};saveConvIP();render();return}
  S.first[step()]=S.tries===0;S.solved=true;S.sel=null;
  if(step()===5) applySolution(5);
  S.fb={cls:'ok',msg:'Bravo ! '+r.ok};saveConvIP();render();
}
function reveal(){applySolution(step());S.first[step()]=false;S.solved=true;S.sel=null;const r=check();S.fb={cls:'hint',msg:'Correction : '+(r.ok||'').replace(/^Juste\.\s*/,'')};saveConvIP();render()}
function next(){S.pos++;S.tries=0;S.solved=false;S.fb=null;S.sel=null;
  if(S.pos>=C.steps.length){const t={'C1.1':[0,0],'C1.2':[0,0]};C.steps.forEach(k=>{const c=STEPS[k].c;t[c][1]++;if(S.first[k])t[c][0]++});RESULTS[CI]=t;checkConv();}
  saveConvIP();
  if(!REMDONE&&ERRS.size>=2){startRem(true);return}
  if(PENDING){const t=PENDING;PENDING=null;startGR(t,{auto:true,cont:()=>render()});return}
  render();window.scrollTo({top:0});}

function compBlock(title,t){
  const b=$('div',{class:'bilan'});
  const names={'C1.1':'Flécher et nommer les grandeurs','C1.2':'Conventions générateur et récepteur'};
  Object.keys(t).forEach(c=>{const x=t[c],p=x[1]?Math.round(100*x[0]/x[1]):0;
    const bar=$('div',{class:'bar'});bar.appendChild($('i',{style:'width:'+p+'%'}));
    b.appendChild($('div',{class:'compline'},[$('span',{text:c+' · '+names[c]}),$('span',{class:'score',text:x[0]+'/'+x[1]}),bar]));});

const Rn=(n,v,lab)=>({t:'R',n,v,lab}), Ser=(...c)=>({t:'S',c}), Par=(...c)=>({t:'P',c});
function val(x){return x.t==='R'?x.v:x.t==='S'?x.c.reduce((s,y)=>s+val(y),0):1/x.c.reduce((s,y)=>s+1/val(y),0)}

const allSer=x=>leaves(x).reduce((s,r)=>s+r.v,0), allPar=x=>1/leaves(x).reduce((s,r)=>s+1/r.v,0);
function lay(x){
  if(x.t==='R') return x.w=78,x.h=46,x;
  x.c.forEach(lay);
  if(x.t==='S'){x.w=x.c.reduce((s,y)=>s+y.w,0);x.h=Math.max(...x.c.map(y=>y.h));}
  else{x.g=16;x.w=Math.max(...x.c.map(y=>y.w))+2*x.g;x.h=x.c.reduce((s,y)=>s+y.h,0);}
  return x;
}
function drawNet(p,x,x0,yc){
  const W=(a,b,c,d)=>el('line',{x1:a,y1:b,x2:c,y2:d,stroke:'var(--ink)','stroke-width':2.2,'stroke-linecap':'round'},p);
  if(x.t==='R'){
    W(x0,yc,x0+21,yc);W(x0+57,yc,x0+78,yc);
    el('rect',{x:x0+21,y:yc-8,width:36,height:16,fill:'var(--surface2)',stroke:'var(--ink)','stroke-width':2.2},p);
    txt(p,x0+28,yc-14,x.lab||x.n,{'font-size':14});
    return;
  }
  if(x.t==='S'){let cx=x0;x.c.forEach(y=>{drawNet(p,y,cx,yc);cx+=y.w;});return;}
  const inner=x.w-2*x.g;let y0=yc-x.h/2;const ys=[];
  x.c.forEach(y=>{const cy=y0+y.h/2;ys.push(cy);const cx=x0+x.g+(inner-y.w)/2;
    if(cx>x0+x.g)W(x0+x.g,cy,cx,cy);drawNet(p,y,cx,cy);if(cx+y.w<x0+x.g+inner)W(cx+y.w,cy,x0+x.g+inner,cy);y0+=y.h;});
  W(x0,yc,x0+x.g,yc);W(x0+x.w-x.g,yc,x0+x.w,yc);
  W(x0+x.g,ys[0],x0+x.g,ys[ys.length-1]);W(x0+x.w-x.g,ys[0],x0+x.w-x.g,ys[ys.length-1]);
  [x0+x.g,x0+x.w-x.g].forEach(nx=>el('circle',{cx:nx,cy:yc,r:3.6,fill:'var(--ink)'},p));
}
function netSvg(net){

  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Réseau de résistances entre A et B',style:'max-width:'+Math.min(400,W*1.25)+'px'});

function reqPart(net,q,extra){

function ohmAnswerText(part){return part.kind==='choice'?part.ch[part.ans]:eng(part.ans,part.unit)}
function ohmCheck(){
  const part=O.d.parts[O.p];let r;
  if(part.kind==='choice'){
    if(O.choice===null){O.fb={cls:'hint',msg:'Choisis une réponse.'};renderOhm();return}
    r=O.choice===part.ans?{ok:true}:{bad:part.hint};
  }else{
    const x=parseFloat(String(O.val).replace(',','.').replace(/\s/g,''));
    if(isNaN(x)){O.fb={cls:'hint',msg:'Écris une valeur numérique (par exemple 4,7), puis choisis le préfixe.'};renderOhm();return}
    const v=x*PREF.find(p=>p[0]===O.pref)[1],a=part.ans,tol=part.tol||0.02,near=(u,w)=>Math.abs(u-w)<=Math.abs(w)*tol+1e-15;
    if(near(v,a)) r={ok:true};
    else{
      const t=(part.traps||[]).find(t=>t.v&&near(v,t.v)&&!near(t.v,a));
      if(t) r={bad:t.m,ty:classify(O.act.key,t.m)};
      else if(near(v,a*1000)||near(v,a/1000)||near(v,a*1e6)||near(v,a/1e6)) r={bad:'Le calcul est bon, mais pas le préfixe : ta valeur est '+(Math.abs(v)>Math.abs(a)?'trop grande':'trop petite')+' d’un facteur '+(near(v,a*1e6)||near(v,a/1e6)?'1 000 000':'1000')+'. Vérifie les conversions (mA → A, kΩ → Ω).'};
      else if(near(v,-a)) r={bad:'La valeur est bonne, mais pas le signe. Regarde le sens des flèches de U et de I.'};
      else r={bad:part.hint};
    }
  }
  if(r.bad&&!r.ty) r.ty=/pas le préfixe/.test(r.bad)?'prefix':/pas le signe/.test(r.bad)?classify(O.act.key,'','sign'):(part.kind==='choice')?(part.ty||(O.act.key==='ohm'?'sign':null)):null;
  if(r.ok){O.first[O.p]=O.tries===0;O.solved=true;O.fb={cls:'ok',msg:'Bravo ! Résultat : '+ohmAnswerText(part)+'.'};}
  else{O.tries++;noteErr(r.ty,O.ex.id);O.fb={cls:'bad',msg:(O.tries>=2?'Encore raté. ':'Pas tout à fait. ')+r.bad};}
  if(O.solved&&O.p===O.d.parts.length-1) saveOhm(); else saveIP();
  renderOhm();
}
function ohmReveal(){const part=O.d.parts[O.p];O.first[O.p]=false;O.solved=true;O.fb={cls:'hint',msg:'Correction : '+part.hint+' Résultat : '+ohmAnswerText(part)+'.'};if(O.p===O.d.parts.length-1)saveOhm();else saveIP();renderOhm();}
function ohmNextPart(){const part=O.d.parts[O.p];O.done.push('✓ '+part.q+' '+ohmAnswerText(part));O.p++;O.val='';O.pref='';O.choice=null;O.tries=0;O.solved=false;O.fb=null;saveIP();renderOhm();}
function saveOhm(){const n=O.d.parts.length,ok=O.first.filter(Boolean).length;O.act.res[O.i]=[ok,n];delete INPROG[O.act.key+':'+O.i];checkAct(O.act.key);saveProg();}
function saveIP(){INPROG[O.act.key+':'+O.i]={seed:O.seed,p:O.p,tries:O.tries,solved:O.solved,fb:O.fb,first:O.first,done:O.done};saveProg();}

function divSvg(it,st){
  const svg=el('svg',{viewBox:'0 0 360 270',role:'img','aria-label':it.name});
  const L=(a,b,c,d)=>el('line',{x1:a,y1:b,x2:c,y2:d,stroke:'var(--ink)','stroke-width':2.4,'stroke-linecap':'round'},svg);
  it.wires.forEach(w=>L(...w));
  const e=it.E;el('circle',{cx:e.x,cy:e.y,r:20,fill:'var(--surface2)',stroke:'var(--ink)','stroke-width':2.4},svg);
  L(e.x,e.y-20,e.x,e.y+20);
  const ax=e.right?e.x+32:e.x-32;arrow(svg,ax,e.y,34,'up','var(--ink)',2.4);txt(svg,e.right?ax+8:ax-20,e.y+6,'E');
  const g=it.gnd;L(g[0],g[1],g[0],g[1]+10);L(g[0]-13,g[1]+10,g[0]+13,g[1]+10);[0,1,2].forEach(i=>L(g[0]-9+i*8,g[1]+12,g[0]-15+i*8,g[1]+21));
  it.res.forEach(r=>{
    const w=r.o==='h'?r.len:20,h=r.o==='h'?20:r.len,sel=st.sel===r.n,ok=st.show===r.n;
    el('rect',{x:r.x-w/2,y:r.y-h/2,width:w,height:h,fill:sel||ok?'var(--accent)':'var(--surface2)','fill-opacity':sel||ok?0.2:1,stroke:ok?'var(--ok)':sel?'var(--accent)':'var(--ink)','stroke-width':sel||ok?3.2:2.4},svg);
    txt(svg,r.lx,r.ly,r.n,sel?{fill:'var(--accent)'}:{});
    if(st.tap){const hw=Math.max(w,30)+14,hh=Math.max(h,30)+14;
      el('rect',{x:r.x-hw/2,y:r.y-hh/2,width:hw,height:hh,fill:'transparent',style:'cursor:pointer'},svg).addEventListener('click',()=>st.tap(r.n));}
  });
  (it.dots||[]).forEach(d=>el('circle',{cx:d[0],cy:d[1],r:4.2,fill:'var(--ink)'},svg));
  (it.labels||[]).forEach(l=>txt(svg,l[1],l[2],l[0],{fill:'var(--eqB)'}));
  if(it.va){const v=it.va;arrow(svg,v.x,v.y,v.len,'up','var(--volt)',2.6);const t=txt(svg,v.lx,v.ly,'V',{fill:'var(--volt)'});el('tspan',{'font-size':11,dy:4},t).textContent=v.lab.split('_')[1];}
  if(it.u){const u=it.u;arrow(svg,u.x,u.y,u.len,u.dir,'var(--volt)',2.6);txt(svg,u.lx,u.ly,u.lab,{fill:'var(--volt)'});}
  return svg;
}

function divCheck(){
  const it=DIV[DV.order[DV.k]],q=it.qs[DV.q];

  else{DV.tries++;DV.fb={cls:'bad',msg:(DV.tries>=2?'Encore raté. ':'Pas tout à fait. ')+q.hint};}
  saveDvIP();renderDiv();
}

 serpar:{comp:'C2.1',title:'Série ou parallèle ?',

 inv:{comp:'C2.1',title:'Résistances en parallèle : le calcul',

 maille:{comp:'C2.2',title:'Loi des mailles',

 num:{comp:'C2.3',title:'Le numérateur du diviseur',

const DEFPACK={ohm:'ohminv',req:'serpar',mail:'maille',div:'num'};
function classify(key,msg,branch){
  if(branch==='prefix') return 'prefix';
  if(branch==='sign') return key==='ohm'?'sign':null;
  if(key==='ohm'){if(/convention générateur/.test(msg))return 'sign';if(/pas R \/ U|pas I \/ U|on divise|On divise|Tu as divisé|R = U \/ I, pas|I = U \/ R, pas/.test(msg))return 'ohminv';return null;}
  if(key==='req') return /inverser|produit sur somme|1\/R2 = 1\/Req/.test(msg)?'inv':'serpar';
  if(key==='mail'){if(/nœud|additionné tous les courants|additionnent|I2 = I − I1/.test(msg))return 'noeud';if(/n’est pas E, c’est|pas V1|R = U \/ I|vaut E1|vaut E2/.test(msg))return null;return 'maille';}
  if(key==='mil') return /maille|U_R1/.test(msg)?'maille':'millman';
  if(key==='sup'){if(/entre A et la masse|numérateur/.test(msg))return 'num';if(/alimente|éteint|fil|ouvert|sens de E2/.test(msg))return 'eteindre';if(/ne s’additionnent|R1 \/\/ R3|R2 \/\/ R3/.test(msg))return 'inv';return null;}
  if(key==='div'){if(/1\/R23|ne s’additionnent pas|inverser/.test(msg))return 'inv';if(/normalisée|inversé le rapport|cible/.test(msg))return null;return 'num';}
  return null;
}

/* ================= MOTEUR DE REMÉDIATION GÉNÉRIQUE ================= */
const ERRT={}, RDONE={}, ALERTS=[]; let PENDING=null, GR=null;
function noteErr(type,ctx){if(!type)return;(ERRT[type]=ERRT[type]||new Set()).add(ctx);if(ERRT[type].size>=2&&!RDONE[type]&&!PENDING)PENDING=type;saveProg();}
function via(fn){if(PENDING){const t=PENDING;PENDING=null;startGR(t,{auto:true,cont:fn});}else fn();}
function bestPack(key){
  const ids=new Set(ACTS[key].list.map(e=>e.id));let best=null,n=0;
  Object.keys(ERRT).forEach(t=>{if(!PACKS[t])return;const c=[...ERRT[t]].filter(x=>ids.has(x)).length;if(c>n){n=c;best=t;}});
  return best||DEFPACK[key];
}
function startGR(type,o){
  o=o||{};
  GR={active:true,type,P:PACKS[type],auto:!!o.auto,test:!!o.test,cont:o.cont,phase:'intro',round:1,streak:0,errs:0,fast:0,total:0,wrongTotal:0,item:null,ans:null,shown:0,n0:0,n0ans:null,n0fb:null,t0:Date.now(),alerted:false};
  render();window.scrollTo({top:0});
}
function endGR(){RDONE[GR.type]=true;saveProg();const c=GR.cont;GR.active=false;GR=null;if(c)c();else render();window.scrollTo({top:0});}
function grHeader(dots,now){
  modes();
  document.getElementById('h1').textContent='Remédiation – '+GR.P.title;
  document.getElementById('exid').textContent='R109-'+GR.P.comp+'-N'+(GR.phase==='n0'?'0':'1')+' · remédiation ciblée';
  const st=document.getElementById('stars');st.textContent='★☆☆☆';st.setAttribute('aria-label','Niveau 1 sur 4');
  document.getElementById('cname').textContent='Compétence '+GR.P.comp;
  document.getElementById('tabs').innerHTML='';
  const pr=document.getElementById('progress');pr.innerHTML='';
  for(let i=0;i<dots;i++) pr.appendChild($('span',{class:i<now?'done':i===now?'now':''}));
}
function renderGR(){
  const R=GR,P=R.P,card=document.getElementById('card');card.innerHTML='';
  const agent=h=>card.appendChild($('p',{class:'agent',html:fmt(h)}));
  const btn=(t,f,g)=>$('button',{class:'btn '+(g?'ghost':'primary'),type:'button',text:t,onclick:f});
  const head=(a,b)=>card.appendChild($('div',{class:'qhead'},[$('span',{class:'qnum',text:a}),$('span',{class:'comp',text:b})]));
  if(R.phase==='intro'){
    grHeader(0,0);head('Ton agent',P.comp);
    agent(R.auto?P.intro:R.test?'Tu n’as pas encore validé '+P.comp+'. Avant de refaire les tests, on travaille le point qui t’a le plus gêné : '+P.title.toLowerCase()+'.':'On travaille un point précis : '+P.title.toLowerCase()+'.');

    card.appendChild(box);
    card.appendChild($('div',{class:'btns'},[btn('Continuer',endGR)]));return;
  }

const par2=(a,b)=>a*b/(a+b);
function supVals(){return {E1:pick([5,6,9,10,12]),E2:pick([5,9,10,12,15]),R1:Rk(),R2:Rk()};}

function supParts(v,o){
  o=o||{};const s2=o.e2down?-1:1,S=v.R1+v.R2;
  const Ra=v.R3?par2(v.R1,v.R3):v.R1, Rb=v.R3?par2(v.R2,v.R3):v.R2;
  const VA1=s2*v.E2*Ra/(v.R2+Ra), VA2=v.E1*Rb/(v.R1+Rb);
  const f=o.r3?{r3:true}:{},d2=o.e2down?{e2down:true}:{};

   p1:{q:'E1 éteinte : V_A1 =',unit:'V',ans:VA1,fig:SF(Object.assign({e1:'off',va:'V_A1'},f,d2)),
     traps:[{v:s2*v.E2*v.R2/S,m:'Avec E1 éteinte, c’est R1 qui se retrouve entre A et la masse : elle va au numérateur.'},{v:v.E1*v.R1/S,m:'E1 est éteinte : c’est E2 qui alimente le pont.'},].concat(o.e2down?[{v:-VA1,m:'Attention au sens de E2 : fléchée vers le bas, sa contribution est négative.'}]:[])
       .concat(v.R3?[{v:s2*v.E2*v.R1/S,m:'R3 est aussi entre A et la masse, en parallèle avec R1 : utilise R1 // R3.'}]:[]),
     hint:o.r3?'E1 éteinte : entre A et la masse, il y a R1 // R3. V_A1 = E2 × (R1 // R3) / (R2 + R1 // R3).':(o.e2down?'E1 éteinte : pont R2 – R1 alimenté par E2, fléchée vers le bas : V_A1 = −E2 × R1 / (R1 + R2).':'E1 éteinte : pont R2 – R1 alimenté par E2, R1 entre A et la masse : V_A1 = E2 × R1 / (R1 + R2).')},
   p2:{q:'E2 éteinte : V_A2 =',unit:'V',ans:VA2,fig:SF(Object.assign({e2:'off',va:'V_A2'},f,d2)),
     traps:[{v:v.E1*v.R1/S,m:'Avec E2 éteinte, c’est R2 qui se retrouve entre A et la masse : elle va au numérateur.'},{v:s2*v.E2*v.R2/S,m:'E2 est éteinte : c’est E1 qui alimente le pont.'}]
       .concat(v.R3?[{v:v.E1*v.R2/S,m:'R3 est aussi entre A et la masse, en parallèle avec R2 : utilise R2 // R3.'}]:[]),
     hint:o.r3?'E2 éteinte : entre A et la masse, il y a R2 // R3. V_A2 = E1 × (R2 // R3) / (R1 + R2 // R3).':'E2 éteinte : pont R1 – R2 alimenté par E1, R2 entre A et la masse : V_A2 = E1 × R2 / (R1 + R2).'},
   p3:{q:'Superposition : V_A =',unit:'V',ans:VA1+VA2,fig:SF(Object.assign({va:'V_A'},f,d2)),

}

const MILRES={};
const RMIL=()=>pick([1,1.5,2.2,3.3,4.7,6.8,10])*1000;
function milVals(cas,r3){
  const v={cas,E1:pick([5,6,9,10,12,15]),R1:RMIL(),R2:RMIL()};
  v.E2=cas===1?pick([3,5,6,9,12]):cas===2?-pick([3,5,6,9,12]):0;
  if(r3) v.R3=RMIL();
  v.N=v.E1/v.R1+v.E2/v.R2; v.D=1/v.R1+1/v.R2+(r3?1/v.R3:0); v.VA=v.N/v.D;
  return v;
}
const fV=x=>(x<0?'−':'')+fmtN(Math.abs(x))+' V';
const milTxt=v=>`E1 = ${fV(v.E1)}, E2 = ${fV(v.E2)}, R1 = ${eng(v.R1,'Ω')}, R2 = ${eng(v.R2,'Ω')}`+(v.R3?`, R3 = ${eng(v.R3,'Ω')} (entre A et la masse)`:'')+'.';
const milFig=v=>SF(Object.assign({va:'V_A'},v.cas===3?{e2:'off'}:{},v.R3?{r3:true}:{}));
const CASLAB={1:'Cas 1 – E1 et E2 positives',2:'Cas 2 – E1 > 0 et E2 < 0',3:'Cas 3 – E1 > 0 et E2 = 0'};
function milParts(v){
  const absN=v.E1/v.R1+Math.abs(v.E2)/v.R2;
  const nT=(v.cas===2?[{v:absN,m:'E2 est négative : son terme E2/R2 est négatif.'}]:[]).concat([{v:v.E1/v.R1-v.E2/v.R2,m:'Chaque branche apporte E / R avec le signe de E : E1/R1 + E2/R2.'}]);
  const dT=[{v:v.R1+v.R2+(v.R3||0),m:'Au dénominateur, on additionne les inverses des résistances : 1/R1 + 1/R2'+(v.R3?' + 1/R3':'')+'.'}].concat(v.R3?[{v:1/v.R1+1/v.R2,m:'La branche R3 n’a pas de source : elle compte 0 au numérateur mais 1/R3 au dénominateur.'}]:[]);
  const vT=[{v:(v.E1+v.E2)/2,m:'Millman n’est pas une moyenne des tensions : chaque E est divisée par sa résistance.'},{v:v.N,m:'Tu as le numérateur ; il reste à le diviser par le dénominateur.'},{v:v.N*v.D,m:'On divise le numérateur par le dénominateur.'}]
    .concat(v.cas===2?[{v:absN/v.D,m:'E2 est négative : son terme E2/R2 est négatif.'}]:[])
    .concat(v.R3?[{v:v.N/(1/v.R1+1/v.R2),m:'La branche R3 compte au dénominateur : ajoute 1/R3.'}]:[]);
  return {
    N:{q:'Numérateur : E1/R1 + E2/R2 =',unit:'A',ans:v.N,traps:nT,hint:'Chaque branche apporte E / R. '+(v.cas===2?'E2 est négative : E2/R2 est négatif. ':v.cas===3?'E2 = 0 : la branche de E2 apporte 0. ':'')+'Le résultat est en ampères (V / Ω).'},
    D:{q:'Dénominateur : 1/R1 + 1/R2'+(v.R3?' + 1/R3':'')+' =',unit:'S',ans:v.D,traps:dT,hint:'On additionne les inverses des résistances de toutes les branches reliées à A. Le résultat est en siemens (S = 1/Ω).'},
    V:{q:'V_A =',unit:'V',ans:v.VA,traps:vT,hint:'Millman : V_A = (E1/R1 + E2/R2) / (1/R1 + 1/R2'+(v.R3?' + 1/R3':'')+').'}};
}

/* Code étudiant : « 2026-NN » (NN = 01 à 99). Tolère tiret bas, espace, point, barre, tiret long, absence de séparateur,
   zéro oublié (« 2026-1 »), lettre O pour zéro, année abrégée (« 26-07 ») ou numéro seul (« 7 ») → « 2026-07 » */
function normCode(v){let t=String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/o/g,'0');
  t=t.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const m=t.match(/^(?:20)?26-?0*([1-9]\d?)$/)||t.match(/^0*([1-9]\d?)$/);
  return m?'2026-'+m[1].padStart(2,'0'):null}

  RD.forEach(k=>L.push('- '+PACKS[k].comp+' · '+PACKS[k].title));
  L.push('','POINTS BLOQUANTS'+(ALERTS.length?'':' : aucun'));
  ALERTS.forEach(a=>L.push('- '+a.comp+' · '+a.point+' ('+a.date+', '+a.errs+' erreurs sur '+a.total+' réponses, '+a.mins+' min)'));
  const code={v:1,id:ID,d:now.toISOString(),V:VALID,c:RESULTS,
    r:Object.fromEntries(Object.keys(ACTS).map(k=>[k,Object.fromEntries(Object.entries(ACTS[k].res).map(([i,x])=>[ACTS[k].list[i].id.replace('R109-',''),x]))])),
    t:DIVRES.t001||null,e:Object.fromEntries(Object.entries(ERRT).map(([k,v])=>[k,v.size])),s:ERRS.size,rd:[...RD,...(REMDONE?['serie']:[])],a:ALERTS.length};
  L.push('','Code (pour le tableau de bord, ne pas modifier) :','R109:'+btoa(unescape(encodeURIComponent(JSON.stringify(code)))));
  return L.join('\n');
}
function subject(){return 'Bilan R1.09 – '+ID.code}
function sendMail(){
  const body=bilanText();
  SENT=new Date().toLocaleString('fr-FR');saveId();SENDMODE=true;
  location.href='mailto:'+MAILTO+'?subject='+encodeURIComponent(subject())+'&body='+encodeURIComponent(body);
  renderSend();
}
function renderSend(){
  modes();const set=(i,t)=>document.getElementById(i).textContent=t;
  set('h1','Envoyer mes résultats');set('exid','R109 · Bilan');set('stars','');set('cname','Code étudiant : '+ID.code);
  document.getElementById('tabs').innerHTML='';document.getElementById('progress').innerHTML='';
  const card=document.getElementById('card');card.innerHTML='';
  card.appendChild($('p',{class:'agent',text:SENT?'Ta messagerie a dû s’ouvrir avec un message déjà rempli pour ton enseignant : vérifie-le et appuie sur « Envoyer ». Tu peux renvoyer ton bilan quand tu veux, le plus récent compte.':'Ton bilan va être préparé dans un message adressé à ton enseignant. Relis-le puis appuie sur « Envoyer » dans ta messagerie.'}));
  const pre=$('pre',{style:'white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto;margin:0',text:bilanText().replace(/\nCode \(pour[\s\S]*$/,'')});
  card.appendChild(pre);
  const msg=$('p',{class:'help',text:'Si ta messagerie ne s’ouvre pas : copie le bilan et envoie-le par courriel à '+MAILTO+'.'});
  const copy=$('button',{class:'btn ghost',type:'button',text:'Copier le bilan',onclick:async()=>{
    const txt=subject()+'\n\n'+bilanText();let ok=false;
    try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
    msg.textContent=ok?'Bilan copié. Colle-le dans un courriel à '+MAILTO+'.':'La copie automatique n’a pas marché : sélectionne le texte ci-dessus à la main.';}});
  card.appendChild($('div',{class:'btns'},[$('button',{class:'btn primary',type:'button',text:SENT?'Renvoyer par courriel':'Envoyer par courriel',onclick:sendMail}),copy]));
  card.appendChild(msg);
  card.appendChild($('div',{class:'btns'},[$('button',{class:'btn ghost',type:'button',text:'Revenir aux exercices',onclick:()=>{SENDMODE=false;render();window.scrollTo({top:0});}})]));
  if(SENT)card.appendChild($('p',{class:'help',text:'Dernier envoi préparé le '+SENT+'.'}));
  teacherBar();
}
function renderIdent(){
  document.getElementById('modes').innerHTML='';const set=(i,t)=>document.getElementById(i).textContent=t;
  set('h1','Bienvenue');set('exid','R109 · Électronique');set('stars','');set('cname','Avant de commencer');
  document.getElementById('tabs').innerHTML='';document.getElementById('progress').innerHTML='';document.getElementById('notice').hidden=true;
  const card=document.getElementById('card');card.innerHTML='';
  card.appendChild($('p',{class:'agent',text:'Je suis ton agent pour l’électronique (R1.09). Je vais te proposer des exercices chapitre par chapitre et t’aider quand tu bloques. Saisis le code que ton enseignant t’a donné : il remplace ton nom et permet à ton enseignant de retrouver ton bilan.'}));
  const f=(lab,k,ph)=>{const i=$('input',{type:'text',autocomplete:'off',autocapitalize:'none',inputmode:'text',spellcheck:'false',placeholder:ph,style:'font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px;width:100%;box-sizing:border-box'});
    if(ID)i.value=ID[k];card.appendChild($('label',{style:'display:grid;gap:4px;font-weight:600'},[$('span',{text:lab}),i]));return i};
  const c=f('Code étudiant','code','ex. 2026-07');
  card.appendChild($('p',{class:'help',text:'N’écris pas ton nom : seulement le code.'}));
  const err=$('p',{class:'fb bad',hidden:''});
  card.appendChild(err);
  card.appendChild($('div',{class:'btns'},[$('button',{class:'btn primary',type:'button',text:'Commencer',onclick:()=>{
    if(!c.value.trim()){err.textContent='Saisis ton code.';err.hidden=false;return}
    const v=normCode(c.value);
    if(!v){err.textContent='Code non reconnu. Il est de la forme 2026- suivi de ton numéro à deux chiffres, par exemple 2026-07.';err.hidden=false;return}
    ID={code:v};saveId();document.getElementById('foot').hidden=false;render();window.scrollTo({top:0});}})]));
  document.getElementById('foot').hidden=true;document.getElementById('teacher').innerHTML='';
}
let RESETASK=false;
function teacherBar(){
  const t=document.getElementById('teacher');t.innerHTML='';
  if(ETU){if(!ID||SENDMODE)return;
    t.appendChild($('button',{type:'button','aria-pressed':'true',text:'Envoyer mes résultats',onclick:()=>{SENDMODE=true;NOTICE='';render();window.scrollTo({top:0});}}));
    t.appendChild($('button',{type:'button',text:'Code '+ID.code+' – modifier',onclick:()=>{renderIdent();window.scrollTo({top:0});}}));
    return;}
  t.appendChild($('button',{type:'button','aria-pressed':TEACHER?'true':'false',text:TEACHER?'Mode enseignant : activé':'Mode enseignant',onclick:()=>{TEACHER=!TEACHER;NOTICE='';saveProg();render();}}));
  if(TEACHER){
    t.appendChild($('button',{type:'button','aria-pressed':MODE==='alerts'?'true':'false',text:'Remédiations et signalements ('+ALERTS.length+')',onclick:()=>{MODE='alerts';NOTICE='';render();window.scrollTo({top:0});}}));
    const b=$('button',{type:'button',class:RESETASK?'danger':'',text:RESETASK?'Confirmer : tout effacer':'Réinitialiser la progression',onclick:()=>{
      if(!RESETASK){RESETASK=true;teacherBar();return}
      try{localStorage.removeItem(STORE)}catch(e){}
      RESULTS.fill(null);[OHMRES,REQRES,MAILRES,DIVRES,DIVCRES,SUPRES,MILRES].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));Object.keys(VALID).forEach(k=>VALID[k]=false);
      ERRS.clear();REMDONE=false;RESETASK=false;Object.keys(ERRT).forEach(k=>delete ERRT[k]);Object.keys(RDONE).forEach(k=>delete RDONE[k]);ALERTS.length=0;[INPROG,CONVIP].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));DVIP=null;PENDING=null;GR=null;O=null;DV=null;Object.keys(LAST).forEach(k=>delete LAST[k]);MODE='conv';TEACHER=true;saveProg();fresh(0);render();}});
    t.appendChild(b);
  }
}
if(ETU){document.getElementById('foot').textContent='Ta progression est mémorisée sur cet appareil et dans ce navigateur : utilise toujours le même pour continuer. Si tu bloques, parles-en à ton enseignant en TD.';document.title='Agent pédagogique R1.09 – Électronique';}
loadProg();
fresh(Math.max(0,RESULTS.findIndex(r=>!r)));
if(VALID.mil){MODE='ch4';render();}
else if(VALID.sup){startAct('mil',firstAct('mil'));}
else if(VALID.div){startAct('sup',firstAct('sup'));}
else if(VALID.divid){startAct('div',firstAct('div'));}
else if(VALID.mail){MODE='c22';render();}
else if(VALID.req){startAct('mail',firstAct('mail'));}
else if(VALID.ohm){startAct('req',firstAct('req'));}
else if(VALID.conv){startAct('ohm',firstAct('ohm'));}
else render();
})();
</script>
